<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".75"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><linearGradient id="accentBorder" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".2"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseOrb1{0%{transform:translate(0,0) scale(1);opacity:.25}50%{transform:translate(30px,-20px) scale(1.15);opacity:.45}}@keyframes pulseOrb2{0%{transform:translate(0,0) scale(1);opacity:.2}50%{transform:translate(-40px,25px) scale(1.2);opacity:.4}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.gradient-title{fill:url(#primaryGrad)}.pill-text,.subtitle-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:400;font-size:19px;fill:#94a3b8}.pill-text{font-weight:600;font-size:13px;fill:#e2e8f0}.orb-1{transform-origin:200px 100px;animation:pulseOrb1 8s ease-in-out infinite}.orb-2{transform-origin:1000px 300px;animation:pulseOrb2 10s ease-in-out infinite}.flow-line{stroke-dasharray:6 6;animation:flowDash 2.5s linear infinite}.node-float{animation:floatNode 4s ease-in-out infinite}</style></defs><rect width="1200" height="400" fill="url(#bgGrad)"/><circle cx="200" cy="120" r="160" fill="#38bdf8" class="orb-1" filter="url(#glow)"/><circle cx="1020" cy="260" r="180" fill="#818cf8" class="orb-2" filter="url(#glow)"/><circle cx="600" cy="380" r="140" fill="#c084fc" filter="url(#glow)" opacity=".15"/><g stroke="#334155" stroke-width=".75" opacity=".3"><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="320" y2="320"/><line x1="150" x2="150" y1="0" y2="400"/><line x1="300" x2="300" y1="0" y2="400"/><line x1="450" x2="450" y1="0" y2="400"/><line x1="600" x2="600" y1="0" y2="400"/><line x1="750" x2="750" y1="0" y2="400"/><line x1="900" x2="900" y1="0" y2="400"/><line x1="1050" x2="1050" y1="0" y2="400"/></g><g class="node-float" opacity=".85"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 820 120 L 930 120 L 980 180" class="flow-line"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M 820 280 L 930 280 L 980 220" class="flow-line"/><path fill="none" stroke="#818cf8" stroke-width="2.5" d="M 980 200 L 1100 200" class="flow-line"/><rect width="130" height="50" x="700" y="95" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" rx="10"/><text x="765" y="126" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">API Consumer</text><rect width="130" height="50" x="700" y="255" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5" rx="10"/><text x="765" y="286" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">API Provider</text><rect width="150" height="60" x="940" y="170" fill="url(#cardGrad)" stroke="url(#accentBorder)" stroke-width="2" filter="url(#subtleGlow)" rx="12"/><text x="1015" y="196" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Contract Verification</text><text x="1015" y="215" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">✓ Verified Schema</text></g><g transform="translate(80, 110)"><rect width="220" height="32" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.5" rx="16"/><circle cx="16" cy="16" r="5" fill="#38bdf8"/><text x="32" y="21" fill="#38bdf8" class="pill-text" font-size="12">CURATED ECOSYSTEM ⚡</text><text x="0" y="85" class="title-text">Awesome <tspan class="gradient-title">API Design</tspan></text><text x="0" y="140" class="title-text">&amp; <tspan class="gradient-title">Contract Testing</tspan> 🚀</text><text x="0" y="185" class="subtitle-text">The definitive toolkit for spec-first API design, mocking, and consumer-driven contracts.</text><g transform="translate(0, 215)"><rect width="110" height="32" x="0" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="16"/><text x="55" y="20" class="pill-text" text-anchor="middle">OpenAPI / OAS</text><rect width="130" height="32" x="120" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="16"/><text x="185" y="20" class="pill-text" text-anchor="middle">Contract Testing</text><rect width="125" height="32" x="260" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="16"/><text x="322" y="20" class="pill-text" text-anchor="middle">Mocking &amp; Linting</text><rect width="115" height="32" x="395" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="16"/><text x="452" y="20" class="pill-text" text-anchor="middle">Shift-Left QA</text></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .gradient-title {
        fill: url(#primaryGrad);
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }

      /* Dynamic Animations (Background/Cards strictly behind text) */
      @keyframes pulseOrb1 {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.25; }
        50% { transform: translate(30px, -20px) scale(1.15); opacity: 0.45; }
      }
      @keyframes pulseOrb2 {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
        50% { transform: translate(-40px, 25px) scale(1.2); opacity: 0.4; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      .orb-1 {
        transform-origin: 200px 100px;
        animation: pulseOrb1 8s ease-in-out infinite;
      }
      .orb-2 {
        transform-origin: 1000px 300px;
        animation: pulseOrb2 10s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: flowDash 2.5s linear infinite;
      }
      .node-float {
        animation: floatNode 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Glowing Nebulas / Orbs (strictly background) -->
  <circle class="orb-1" cx="200" cy="120" r="160" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="260" r="180" fill="#818cf8" filter="url(#glow)" />
  <circle cx="600" cy="380" r="140" fill="#c084fc" opacity="0.15" filter="url(#glow)" />

  <!-- Tech Grid Background Pattern -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.3">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Decorative Flow Diagram / Contract Testing Graphic on right -->
  <g class="node-float" opacity="0.85">
    <!-- Connecting dashed animated lines -->
    <path class="flow-line" d="M 820 120 L 930 120 L 980 180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M 820 280 L 930 280 L 980 220" fill="none" stroke="#c084fc" stroke-width="2" />
    <path class="flow-line" d="M 980 200 L 1100 200" fill="none" stroke="#818cf8" stroke-width="2.5" />

    <!-- Node 1: Consumer (Design/Mock) -->
    <rect x="700" y="95" width="130" height="50" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="765" y="126" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="13">API Consumer</text>

    <!-- Node 2: Provider (Service) -->
    <rect x="700" y="255" width="130" height="50" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5" />
    <text x="765" y="286" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="700" font-size="13">API Provider</text>

    <!-- Node 3: Executable Contract Hub -->
    <rect x="940" y="170" width="150" height="60" rx="12" fill="url(#cardGrad)" stroke="url(#accentBorder)" stroke-width="2" filter="url(#subtleGlow)" />
    <text x="1015" y="196" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Contract Verification</text>
    <text x="1015" y="215" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="11">✓ Verified Schema</text>
  </g>

  <!-- Foreground Main Branding & Typography (Crisp and Unobscured) -->
  <g transform="translate(80, 110)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" class="pill-text" fill="#38bdf8" font-size="12">CURATED ECOSYSTEM ⚡</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text">
      Awesome <tspan class="gradient-title">API Design</tspan>
    </text>
    <text x="0" y="140" class="title-text">
      &amp; <tspan class="gradient-title">Contract Testing</tspan> 🚀
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle-text">
      The definitive toolkit for spec-first API design, mocking, and consumer-driven contracts.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="110" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="55" y="20" text-anchor="middle" class="pill-text">OpenAPI / OAS</text>

      <!-- Pill 2 -->
      <rect x="120" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="185" y="20" text-anchor="middle" class="pill-text">Contract Testing</text>

      <!-- Pill 3 -->
      <rect x="260" y="0" width="125" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="322" y="20" text-anchor="middle" class="pill-text">Mocking &amp; Linting</text>

      <!-- Pill 4 -->
      <rect x="395" y="0" width="115" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="452" y="20" text-anchor="middle" class="pill-text">Shift-Left QA</text>
    </g>
  </g>
</svg>
